<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCar - Novo Cliente</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <link rel="stylesheet" href="/css/cadastro.css">
</head>

<body>
    <header class="cabecalho">
        <a href="index.html">ÍNICIO</a>
        <a href="pages/clientes/lista-clientes.html">CLIENTES</a>
        <a href="pages/carros/lista-carros.html">CARROS</a>
        <a href="pages/pedidos/lista-pedidos.html">PEDIDOS</a>
    </header>

    <main class="conteudo-principal">
        <div class="div-titulo">
            <h1>CADASTRO CLIENTE</h1>
        </div>
        <div class="div-formulario">
            <form onsubmit="enviarFormularioCadastro(event)" method="post" class="form-cadastro">
                <label for="nome-cliente">
                    Nome *
                    <input type="text" id="nome-cliente" name="nome-cliente" placeholder="Insira o nome completo"
                        minlength="3" required>
                </label>
                <label for="cpf-cliente">
                    CPF *
                    <input type="number" id="cpf-cliente" name="cpf-cliente"
                        placeholder="Insira o CPF (somente números)" title="Digite exatamente 11 números" required>
                </label>
                <label for="telefone-cliente">
                    Telefone *
                    <input type="tel" id="telefone-cliente" name="telefone-cliente"
                        placeholder="Insira o telefone (somente números)" pattern="\d{10,11}"
                        title="Digite entre 10 e 11 números" required>
                </label>
                <p style="color: red">* Campos obrigatórios</p>

                <input type="submit" value="CADASTRAR CLIENTE">
            </form>
        </div>
    </main>

    <script src="/js/cliente.js"></script>
</body>

</html>
